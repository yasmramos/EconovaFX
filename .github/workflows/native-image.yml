# This workflow builds a GraalVM Native Image of the JavaFX application for Windows
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Native Image Build (Windows)

on:
  push:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  native-image-build-windows:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up GraalVM JDK 21 (latest GraalVM for GluonFX)
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        native-image-job: 'true'
        cache: 'maven'
    
    - name: Verify GraalVM installation
      run: |
        echo "JAVA_HOME: $env:JAVA_HOME"
        java --version
        native-image --version
    
    - name: Build Native Image
      run: mvn clean gluonfx:build -Pnative --file pom.xml
      env:
        GRAALVM_HOME: ${{ env.GRAALVM_HOME }}
    
    - name: List build artifacts
      run: |
        echo "=== Build output directory ==="
        if (Test-Path "target\gluonfx\x86_64-windows\") { 
          Get-ChildItem target\gluonfx\x86_64-windows\ 
        } else { 
          Write-Host "GluonFX output directory not found" 
        }
        echo "=== Executable check ==="
        Get-ChildItem -Recurse -Filter "*.exe" target\ 2>$null | Select-Object FullName
      shell: pwsh
    
    - name: Upload Native Image
      uses: actions/upload-artifact@v5
      with:
        name: econovafx-native-windows
        path: |
          target/gluonfx/x86_64-windows/econovafx.exe
        retention-days: 14
        if-no-files-found: warn
