# This workflow will build a Java project with Maven, run tests, and generate code coverage reports
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-coverage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Verify the project builds and tests pass on all Java LTS releases
        java-version: [17, 21, 25]

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build and Run Tests with Coverage
      run: mvn clean verify --file pom.xml
    
    
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v5
      with:
        name: jacoco-report-jdk${{ matrix.java-version }}
        path: target/site/jacoco/
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: test-results-jdk${{ matrix.java-version }}
        path: target/surefire-reports/

  coverage-comment:
    needs: build-and-coverage
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Download Coverage Report
      uses: actions/download-artifact@v5
      with:
        name: jacoco-report-jdk17
        path: target/site/jacoco/
    
    - name: JaCoCo Code Coverage Report
      uses: madrapps/jacoco-report@v1.6.1
      with:
        paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 60
        min-coverage-changed-files: 70
        title: Code Coverage Report
        update-comment: true
