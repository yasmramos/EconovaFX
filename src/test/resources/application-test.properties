# =============================================================================
# Test Configuration for EconovaFX
# This configuration is used when running tests to ensure proper Ebean initialization
# Uses .properties format to avoid SnakeYAML dependency issues with avaje-config
# =============================================================================

# Override database settings for in-memory H2 during tests
database.type=h2
database.driver=org.h2.Driver
database.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
database.username=sa
database.password=

# Master datasource for Ebean (overrides application.properties)
ebean.datasource.master.driver=org.h2.Driver
ebean.datasource.master.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
ebean.datasource.master.username=sa
ebean.datasource.master.password=
ebean.datasource.master.minConnections=1
ebean.datasource.master.maxConnections=10

# Default datasource for Ebean
ebean.datasource.default.driver=org.h2.Driver
ebean.datasource.default.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
ebean.datasource.default.username=sa
ebean.datasource.default.password=
ebean.datasource.default.minConnections=1
ebean.datasource.default.maxConnections=10

# Ebean Test Configuration - Creates H2 in-memory database automatically
ebean.test.platform=h2
ebean.test.dbName=testdb
ebean.test.ddlMode=dropCreate

# Disable auto migration during tests to use DDL mode
ebean.migration.auto=false
ebean.migration.run=false
